{% load static i18n %}
<a
  href="{{ service.get_absolute_url }}"
  class="group relative isolate block aspect-[5/4] overflow-hidden rounded-sm bg-slate-800 focus-visible:outline-4 focus-visible:outline-offset-2 focus-visible:outline-[#fdb515]"
  aria-label="{% blocktranslate with title=service.display_title %}مشاهده خدمت {{ title }}{% endblocktranslate %}"
>
  {% if service.main_image %}
    <img src="{{ service.main_image.url }}" alt="{{ service.display_title }}" class="absolute inset-0 -z-20 h-full w-full object-cover transition duration-500 group-hover:scale-105 group-focus-visible:scale-105 motion-reduce:transition-none" loading="lazy">
  {% else %}
    <img src="{% static service.fallback_image_name %}" alt="{{ service.display_title }}" class="absolute inset-0 -z-20 h-full w-full object-cover transition duration-500 group-hover:scale-105 group-focus-visible:scale-105 motion-reduce:transition-none" loading="lazy">
  {% endif %}
  <div class="absolute inset-0 -z-10 bg-gradient-to-t from-[#003577]/95 via-[#003577]/20 to-black/5 transition group-hover:from-[#003577]" aria-hidden="true"></div>
  <div class="flex h-full flex-col justify-end px-5 pb-5 pt-16 text-start text-white sm:px-6 sm:pb-6">
    <span class="mb-auto flex h-11 w-11 items-center justify-center rounded-sm border border-[#fdb515]/70 bg-[#003577]/65 text-sm font-bold text-[#fdb515] backdrop-blur-sm" aria-hidden="true">{{ service.position }}</span>
    <h2 class="text-xl font-bold leading-snug sm:text-2xl">{{ service.display_title }}</h2>
    <p class="mt-2 line-clamp-2 text-sm font-medium leading-6 text-white/85">{{ service.display_subtitle }}</p>
    <span class="mt-4 inline-flex items-center gap-2 text-sm font-bold text-[#fdb515]">
      {% translate "مشاهده جزئیات" %}
      <img src="{% static 'icons/arrow-left-black.svg' %}" alt="" class="h-4 w-6 brightness-0 invert transition-transform group-hover:-translate-x-1 {% if not LANGUAGE_BIDI %}rotate-180{% endif %}">
    </span>
  </div>
</a>
